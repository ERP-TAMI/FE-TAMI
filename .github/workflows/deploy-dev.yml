name: Deploy application

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI and security gates
    uses: ./.github/workflows/ci.yml
    with:
      publish_artifact: true

  deploy:
    name: Publish checked static site
    needs: checks
    if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOYMENT_CONFIG_PARAMETER: ${{ vars.DEPLOYMENT_CONFIG_PARAMETER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Assume environment deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-erp-fe-${{ github.run_id }}
      - name: Discover current infrastructure
        id: target
        run: node scripts/deployment-config.mjs
      - name: Publish assets, refresh entry point and verify release
        env:
          S3_FRONTEND_BUCKET: ${{ steps.target.outputs.frontend_bucket }}
          CLOUDFRONT_DIST_ID: ${{ steps.target.outputs.cloudfront_distribution_id }}
          APP_URL: ${{ steps.target.outputs.app_url }}
        run: node scripts/publish-frontend.mjs
