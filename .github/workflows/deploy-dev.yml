name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fe-dev
  cancel-in-progress: false

jobs:
  checks:
    name: CI and security gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and publish static site
    needs: checks
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install and build FE
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_NAME: TAMI ERP

      # aws-actions/configure-aws-credentials v6.3.0
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-erp-fe-dev

      - name: Publish versioned assets and refresh entry point
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_FRONTEND_BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
          CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$S3_FRONTEND_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$CLOUDFRONT_DIST_ID" =~ ^[A-Z0-9]+$ ]]
          [[ "$APP_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]
          aws s3 sync dist/assets/ "s3://${S3_FRONTEND_BUCKET}/assets/" \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync dist/ "s3://${S3_FRONTEND_BUCKET}/" \
            --exclude index.html --exclude 'assets/*' --cache-control 'no-cache,max-age=0,must-revalidate'
          # Keep existing hashed assets for browsers with an older entry point.
          aws s3 cp dist/index.html "s3://${S3_FRONTEND_BUCKET}/index.html" \
            --cache-control 'no-cache,max-age=0,must-revalidate'
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths '/index.html' '/' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DIST_ID" --id "$invalidation_id"
          node --input-type=module <<'JS'
          const origin = process.env.APP_URL;
          const response = await fetch(origin);
          if (!response.ok) throw new Error(`Frontend returned ${response.status}`);
          const html = await response.text();
          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match => match[1]);
          if (!scripts.length) throw new Error('Frontend HTML has no application script');
          for (const path of scripts) {
            const asset = await fetch(new URL(path, origin));
            if (!asset.ok || !asset.headers.get('content-type')?.includes('javascript')) {
              throw new Error(`Application script unavailable: ${path}`);
            }
          }
          console.log('Frontend HTML and application scripts are available.');
          JS
